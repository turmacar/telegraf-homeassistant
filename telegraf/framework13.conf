[global_tags]

[agent]
  interval = "30s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "30s"
  flush_jitter = "0s"
  precision = "0s"
  hostname = "Framework_13"

[[outputs.influxdb_v2]]
  urls = ["http://${INFLUXDB_HOST}:8086"]
  token = "${INFLUXDB_TOKEN}"
  organization = "HomeLab"
  bucket = "telegraf"
  timeout = "30s"

[[outputs.mqtt]]
  servers = ["tcp://${MQTT_HOST}:1883"]
  topic = "systems/{{.Hostname}}/{{.PluginName}}"
  data_format = "json"
  username = "telegraf"
  password = "${TELEGRAF_MQTT_PASSWORD}"

[[inputs.cpu]]
  percpu = false
  totalcpu = true
  collect_cpu_time = false
  report_active = false
  core_tags = false

[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "iso9660", "overlay", "aufs", "squashfs", "zram"]

[[inputs.diskio]]
  devices = ["nvme0n1"]
  skip_serial_number = true

[[inputs.kernel]]

[[inputs.mem]]

[[inputs.processes]]

[[inputs.swap]]

[[inputs.system]]

[[inputs.net]]
  interfaces = ["wlp1s0"]

[[inputs.netstat]]

# CPU temperature (AMD k10temp — feature tag is lowercase "tctl")
[[inputs.sensors]]

# Battery capacity from sysfs (inputs.battery does not exist in telegraf 1.39)
[[inputs.file]]
  files = ["/sys/class/power_supply/BAT1/capacity"]
  name_override = "battery"
  data_format = "value"
  data_type = "integer"
