[global_tags]

[agent]
  interval = "60s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "60s"
  flush_jitter = "0s"
  precision = "0s"
  hostname = "openwrt"

[[outputs.influxdb_v2]]
  urls = ["http://${INFLUXDB_HOST}:8086"]
  token = "${INFLUXDB_TOKEN}"
  organization = "HomeLab"
  bucket = "telegraf"
  timeout = "30s"

[[outputs.mqtt]]
  servers = ["tcp://${MQTT_HOST}:1883"]
  topic = "systems/{{.Hostname}}/{{.PluginName}}"
  data_format = "json"
  username = "telegraf"
  password = "${TELEGRAF_MQTT_PASSWORD}"
  # Per-client traffic is Influx/Grafana only, not Home Assistant.
  namedrop = ["lan_client"]

[[inputs.cpu]]
  percpu = false
  totalcpu = true
  collect_cpu_time = false
  report_active = false

[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "iso9660", "aufs", "squashfs"]

[[inputs.mem]]

[[inputs.system]]

# WAN interface only - eth0 is the uplink. role=wan tells telegraf_bridge to
# track weekly/monthly usage totals for it (keep this to WAN interfaces only).
[[inputs.net]]
  interfaces = ["eth0"]
  [inputs.net.tags]
    role = "wan"

[[inputs.netstat]]

# DNS query latency to upstream resolvers
[[inputs.dns_query]]
  servers = ["8.8.8.8", "1.1.1.1"]
  domains = ["google.com"]
  record_type = "A"
  timeout = 5

# Per-client LAN traffic via nlbwmon (apk add nlbwmon); script lives at
# telegraf/scripts/openwrt-nlbw-clients.sh in this repo.
[[inputs.exec]]
  # telegraf 1.39+: each command is an argv array; a plain string is deprecated.
  commands = [["/etc/telegraf/nlbw-clients.sh"]]
  timeout = "15s"
  data_format = "influx"
