[global_tags]

[agent]
  interval = "30s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "30s"
  flush_jitter = "0s"
  precision = "0s"
  hostname = "SteamMachine"

[[outputs.influxdb_v2]]
  urls = ["http://${INFLUXDB_HOST}:8086"]
  token = "${INFLUXDB_TOKEN}"
  organization = "HomeLab"
  bucket = "telegraf"
  timeout = "30s"

[[outputs.mqtt]]
  servers = ["tcp://${MQTT_HOST}:1883"]
  topic = "systems/{{.Hostname}}/{{.PluginName}}"
  data_format = "json"
  username = "telegraf"
  password = "${TELEGRAF_MQTT_PASSWORD}"

[[inputs.cpu]]
  percpu = false
  totalcpu = true
  collect_cpu_time = false
  report_active = false
  core_tags = false

[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "iso9660", "overlay", "aufs", "squashfs"]

[[inputs.diskio]]
  devices = ["nvme0n1"]
  skip_serial_number = true

[[inputs.kernel]]

[[inputs.mem]]

[[inputs.processes]]

[[inputs.swap]]

[[inputs.system]]

# wlan0 is the only active interface on this unit (enp5s0/ethernet is down)
[[inputs.net]]
  interfaces = ["wlan0"]

[[inputs.netstat]]

# lm-sensors ships in the base SteamOS image already - no package install
# needed. k10temp exposes CPU Tctl.
[[inputs.sensors]]

# GPU metrics (Navi 33 iGPU) - amdgpu's own sysfs nodes, published as-is
# (native field names/units: gpu_busy_percent, mem_info_vram_used bytes,
# temp1_input millidegrees) under measurement "amdgpu_sysfs". No amd-smi/
# ROCm binary needed (not present on SteamOS, not worth installing outside
# the read-only rootfs) and no field renaming/unit conversion here - that
# happens once, in telegraf_bridge's parse_amdgpu_sysfs(), instead of being
# duplicated in this config and the shell script. Deploy the script to
# ~/telegraf/scripts/ alongside this config.
[[inputs.exec]]
  commands = [["/home/deck/telegraf/scripts/steammachine-amdgpu-metrics.sh"]]
  timeout = "5s"
  data_format = "json"
  name_override = "amdgpu_sysfs"
  tag_keys = ["index"]

