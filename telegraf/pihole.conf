[global_tags]

[agent]
  interval = "30s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "30s"
  flush_jitter = "0s"
  precision = "0s"
  hostname = "pihole"

[[outputs.influxdb_v2]]
  urls = ["http://${INFLUXDB_HOST}:8086"]
  token = "${INFLUXDB_TOKEN}"
  organization = "HomeLab"
  bucket = "telegraf"
  timeout = "30s"

[[outputs.mqtt]]
  servers = ["tcp://${MQTT_HOST}:1883"]
  topic = "systems/{{.Hostname}}/{{.PluginName}}"
  data_format = "json"
  username = "telegraf"
  password = "${TELEGRAF_MQTT_PASSWORD}"

[[inputs.cpu]]
  percpu = false
  totalcpu = true
  collect_cpu_time = false
  report_active = false

[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "iso9660", "overlay", "aufs", "squashfs"]

[[inputs.diskio]]
  devices = ["mmcblk0"]
  skip_serial_number = true

[[inputs.kernel]]

[[inputs.mem]]

[[inputs.processes]]

[[inputs.swap]]

[[inputs.system]]

[[inputs.net]]
  interfaces = ["eth0"]

[[inputs.netstat]]

# Pi CPU temperature from thermal zone
[[inputs.temp]]

# Pi-hole stats via local API
[[inputs.http]]
  urls = ["http://localhost/admin/api.php?summary&auth="]
  name_override = "pihole"
  data_format = "json"
  json_query = ""
  interval = "60s"
