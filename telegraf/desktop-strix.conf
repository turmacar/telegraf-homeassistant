[global_tags]

[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = "0s"
  hostname = "Desktop-STRIX"

[[outputs.influxdb_v2]]
  urls = ["http://${INFLUXDB_HOST}:8086"]
  token = "${INFLUXDB_TOKEN}"
  organization = "HomeLab"
  bucket = "telegraf"
  timeout = "30s"

[[outputs.mqtt]]
  servers = ["tcp://${MQTT_HOST}:1883"]
  topic = "systems/{{.Hostname}}/{{.PluginName}}"
  data_format = "json"
  username = "telegraf"
  password = "${TELEGRAF_MQTT_PASSWORD}"

[[inputs.cpu]]
  percpu = true
  totalcpu = true
  collect_cpu_time = false
  report_active = false
  core_tags = false

[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "iso9660", "overlay", "aufs", "squashfs"]

[[inputs.diskio]]
  devices = ["sda", "sdb", "nvme0n1", "nvme1n1"]
  skip_serial_number = true

[[inputs.kernel]]

[[inputs.mem]]

[[inputs.processes]]

[[inputs.swap]]

[[inputs.system]]

[[inputs.net]]
  interfaces = ["enp10s0", "wlp9s0"]

[[inputs.netstat]]

[[inputs.nstat]]

# CPU and NVMe temperatures via lm-sensors
[[inputs.sensors]]

# GPU metrics via amd-smi (7900 XTX has no NVML) - reshaped to the same
# measurement/tags/fields shape as telegraf's nvidia_smi plugin, published
# under its own "amd_smi" measurement name so telegraf_bridge's
# parse_nvidia_smi() handles both without guessing vendor from hostname.
# Requires the telegraf user in the `render` group to read /dev/kfd without
# sudo.
[[inputs.exec]]
  commands = [["/opt/rocm/bin/amd-smi", "metric", "-u", "-t", "-m", "--json"]]
  timeout = "5s"
  data_format = "json_v2"

  [[inputs.exec.json_v2]]
    measurement_name = "amd_smi"

    [[inputs.exec.json_v2.tag]]
      path = "gpu_data.0.gpu"
      rename = "index"

    [[inputs.exec.json_v2.field]]
      path = "gpu_data.0.usage.gfx_activity.value"
      rename = "utilization_gpu"
      type = "int"

    [[inputs.exec.json_v2.field]]
      path = "gpu_data.0.temperature.edge.value"
      rename = "temperature_gpu"
      type = "int"

    [[inputs.exec.json_v2.field]]
      path = "gpu_data.0.mem_usage.used_vram.value"
      rename = "memory_used"
      type = "int"

# GPU model name, polled infrequently since it never changes - separate exec
# block because amd-smi's static/metric subcommands are different JSON shapes.
[[inputs.exec]]
  commands = [["/opt/rocm/bin/amd-smi", "static", "--asic", "--json"]]
  timeout = "5s"
  interval = "5m"
  data_format = "json_v2"

  [[inputs.exec.json_v2]]
    measurement_name = "amd_smi"

    [[inputs.exec.json_v2.tag]]
      path = "gpu_data.0.gpu"
      rename = "index"

    [[inputs.exec.json_v2.tag]]
      path = "gpu_data.0.asic.market_name"
      rename = "name"

    [[inputs.exec.json_v2.field]]
      path = "gpu_data.0.asic.num_compute_units"
      rename = "compute_units"
      type = "int"
